# Compila el juego y lo publica en GitHub Pages en cada push a 'main'.
# (Tambien se puede lanzar a mano desde la pestaña Actions: 'Run workflow')
#
# Requisito (una sola vez): en GitHub, Settings > Pages > Build and deployment > Source,
# elegir 'GitHub Actions'.

name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos minimos para publicar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan varios push seguidos, no se cancela un despliegue a medias
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Instalar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir la carpeta dist
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
